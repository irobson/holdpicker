name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and bundle
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Test
        run: scripts/test.sh

      - name: Bundle (release, universal, ad-hoc signed)
        run: scripts/bundle.sh
        env:
          UNIVERSAL: "1"

      - name: Verify bundle
        run: |
          plutil -lint build/TedCat.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 build/TedCat.app
          lipo -archs build/TedCat.app/Contents/MacOS/TedCat
          lipo build/TedCat.app/Contents/MacOS/TedCat -verify_arch arm64 x86_64

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/TedCat.app TedCat.zip
          ls -lh TedCat.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: TedCat-${{ github.sha }}
          path: TedCat.zip
          retention-days: 30
          if-no-files-found: error
